name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and format on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.18.2', '22.13.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: test on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.18.2', '22.13.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: the suite has not quietly shrunk
        run: |
          npx vitest run --reporter=json --outputFile=/tmp/vitest.json >/dev/null 2>&1 || true
          count=$(node -e "process.stdout.write(String(require('/tmp/vitest.json').numTotalTests))")
          echo "$count tests"
          if [ "$count" -lt 2000 ]; then
            echo "the suite has fallen below the floor of 2000 tests" >&2
            exit 1
          fi

  coverage:
    name: coverage thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  smoke:
    name: command line smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: npm
      - run: npm ci
      - run: npm run smoke
      - name: every command describes itself
        run: |
          node bin/shakerdeck.js commands --format json > /tmp/commands.json
          node -e "
            const rows = require('/tmp/commands.json');
            const thin = rows.filter((row) => !row.description || row.description.length < 16);
            if (thin.length) {
              console.error('undescribed: ' + thin.map((r) => r.command).join(', '));
              process.exit(1);
            }
            console.log(rows.length + ' commands, all described');
          "

  release:
    name: release check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: npm
      - run: npm ci
      - run: npm run release:check

  docs:
    name: docs and readme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: npm
      - run: npm ci
      - name: every command line the readme and the docs print still runs
        run: npx vitest run tests/readme.test.js tests/docs.test.js
      - name: the tree still holds together
        run: npx vitest run tests/consistency.test.js tests/index.test.js tests/packaging.test.js

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: npm
      - run: npm ci
      - run: npm run audit

  image:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build -t shakerdeck:ci .
      - name: the entry point runs inside it
        run: docker run --rm shakerdeck:ci commands
      - name: and so do the examples it carries
        run: |
          docker run --rm shakerdeck:ci check -c examples/check-brazos.json
          docker run --rm shakerdeck:ci hydraulics -w examples/well-brazos.json -c examples/check-brazos.json
          docker run --rm shakerdeck:ci solids -s examples/solids-control.json
      - name: it is not running as root
        run: |
          user="$(docker run --rm --entrypoint id shakerdeck:ci -un)"
          if [ "$user" = "root" ]; then
            echo "the image runs as root" >&2
            exit 1
          fi
          echo "runs as $user"
      - name: the image carries no development dependency
        run: |
          if docker run --rm --entrypoint ls shakerdeck:ci /app/node_modules | grep -q '^vitest$'; then
            echo "vitest is in the image" >&2
            exit 1
          fi
          echo "no test runner in the image"
